# 사이트 기본 설정. 이 파일을 고치면 사이트 전체에 반영됩니다.
title: Jiho
tagline: AI · Robotics · Physical AI
description: 논문 리뷰, 프로젝트 정리를 위한 블로그
url: "https://jihoai.github.io"
baseurl: ""
lang: ko
timezone: Asia/Seoul
author: Jiho Kuk
github_username: jihoAi

# 글 주소는 기존과 같은 /posts/제목/ 형식을 유지합니다.
permalink: /posts/:title/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

markdown: kramdown
kramdown:
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - tools
  - vendor
  - .devcontainer
